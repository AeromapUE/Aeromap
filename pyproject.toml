[project]
name = "aeromap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Edu", email = "edu.morillasrodriguez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "image>=1.5.33",
    "mercantile>=1.2.1",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "requests>=2.34.2",
]

[project.scripts]
aeromap = "aeromap:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
